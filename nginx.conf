server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything the game loads - the module script, the stylesheet, the
    # canvas-drawn art - comes from this same origin with nothing external
    # (no CDN scripts, no remote fonts/images, no fetch calls), so a strict
    # same-origin policy costs nothing and closes off injected-script
    # execution if an XSS bug is ever introduced.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Cloud Run already terminates TLS and this host already redirects
    # http -> https, but HSTS closes the brief window before that redirect
    # on a user's very first visit (e.g. over untrusted wifi).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
